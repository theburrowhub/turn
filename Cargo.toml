[workspace]
resolver = "2"
members = [
    "crates/turn-core",
    "crates/turn-proto",
    "crates/turn-store",
    "crates/turn-pty",
    "crates/turn-agents",
    "crates/turn-hook",
    "crates/turnd",
    "crates/turn-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/jamuriano/turn"

[workspace.dependencies]
turn-core = { path = "crates/turn-core" }
turn-proto = { path = "crates/turn-proto" }
turn-store = { path = "crates/turn-store" }
turn-pty = { path = "crates/turn-pty" }
turn-agents = { path = "crates/turn-agents" }

anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.24", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal", "process", "fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
portable-pty = "0.9"
vt100 = "0.16"
rusqlite = { version = "0.40", features = ["bundled"] }
sysinfo = "0.39"
axum = "0.8"
directories = "6.0"
regex = "1.11"
shell-words = "1.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
