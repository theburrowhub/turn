name: Release macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: package / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/turn-release.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" \
            -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          echo "TURN_RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Write App Store Connect notarization key
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
        run: |
          printf '%s' "$NOTARY_KEY_BASE64" | /usr/bin/base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Sign, notarize and assemble release assets
        env:
          TURN_CODESIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          TURN_EXPECT_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TURN_NOTARY_KEY: ${{ runner.temp }}/AuthKey.p8
          TURN_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          TURN_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          TURN_RELEASE_TAG: ${{ github.ref_name }}
          TURN_RELEASE_BASE_URL: https://github.com/theburrowhub/turn/releases/download/${{ github.ref_name }}
        run: make macos-release

      - name: Upload signed assets to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: turn-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

      - name: Remove temporary signing material
        if: always()
        run: |
          if [[ -n "${TURN_RELEASE_KEYCHAIN:-}" ]]; then
            security delete-keychain "$TURN_RELEASE_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"

  publish:
    name: publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: turn-macos-*
          path: dist
          merge-multiple: true

      - name: Publish with GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Turn $GITHUB_REF_NAME" \
            --generate-notes
