[package]
name = "turn-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "turn"
path = "src/main.rs"

[dependencies]
turn-core = { workspace = true }
turn-proto = { workspace = true }
# For `is_display_safe`: the one definition of which characters can make a string render as
# something other than itself. A link target is process-controlled text the user is asked to
# trust, so it goes through the same rule as a title rather than a second copy of it.
turn-pty = { workspace = true }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
egui = "0.36"
# Icons as a font rather than hand-drawn glyphs. The bundled proportional face has no
# pictographs, so a toolbar drawn from its characters would be missing-glyph boxes; a
# real icon font is one file and renders identically on both platforms.
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
directories = { workspace = true }
shell-words = { workspace = true }
# The window must be able to tell the user something finished while they are looking
# at another application, which is the entire product. Reaching the OS notification
# centre needs a platform binding; everything that *decides* whether to notify lives
# in `announce.rs` and is tested without it.
# `z` is notify-rust's zbus D-Bus backend, required for its Linux implementation.
notify-rust = { version = "4.11", default-features = false, features = ["z"] }
# Native project-folder selection. The dialog is created on the UI thread, then its
# async result is awaited by a short-lived worker so the egui event loop stays idle.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
pollster = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# AppKit exposes the user's live Reduce Motion and Increase Contrast choices. Reading
# them directly avoids a shell process and lets the app compare the current values live.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAccessibility", "NSWorkspace"] }

[dev-dependencies]
# The GUI intentionally receives semantic profile references rather than linking
# provider launch code. This test-only edge keeps its four quick choices locked to
# the provider-owned registry catalogue so the two cannot drift silently.
turn-agents = { workspace = true }
# `eframe` lets the harness run the real `TurnApp` rather than only its view, which is
# what makes the idle-repaint measurement a test of the application.
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
# `start_paused` lets the reconnect backoff be tested in microseconds rather than by
# waiting out a real thirty seconds.
tokio = { workspace = true, features = ["test-util"] }
# The onboarding contract is exercised across the actual GUI transport and an
# in-process daemon. Its socket and durable store both live in a TempDir, so the test
# can prove restart persistence without reading or writing the developer's Turn state.
turnd = { path = "../turnd" }
tempfile = "3"
# The copy rules are checked against a screen a real terminal parsed rather than a grid built
# by hand. A hand-built grid can be made to satisfy any rule — including a wrap flag set where
# no wrap happened — so the emulator has to be the one that decides where the line broke.
vt100 = { workspace = true }
