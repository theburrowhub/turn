[package]
name = "turn-hook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Status-line fallback rendering needs a bounded parse of Claude Code's official
# JSON contract. Keep the helper synchronous and otherwise dependency-free: it
# still has no async runtime or TLS stack on this hot path.
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lib]
name = "turn_hook"
path = "src/lib.rs"

[[bin]]
name = "turn-hook"
path = "src/main.rs"
